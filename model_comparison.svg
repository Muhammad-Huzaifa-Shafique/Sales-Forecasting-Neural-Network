<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 534" width="860" height="534" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Forecast error of each model on the 12-month hold-out</title>
<desc id="d">Horizontal bars of weighted absolute percentage error for nine models, with and without the November 2023 bulk order. The final neural network, v4, has the lowest error in both cases.</desc>
